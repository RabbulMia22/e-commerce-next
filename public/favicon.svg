<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Background -->
  <rect width="64" height="64" rx="12" fill="url(#bg-gradient)"/>
  
  <!-- Shopping cart -->
  <g transform="translate(16, 16)">
    <!-- Cart body -->
    <path d="M4 4h6l2 12h14l2-8H8" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Cart wheels -->
    <circle cx="12" cy="24" r="2" fill="white"/>
    <circle cx="24" r="2" fill="white"/>
    <!-- Handle -->
    <path d="M4 4L2 0" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  
  <!-- ShopMate "S" logo -->
  <circle cx="48" cy="16" r="8" fill="rgba(255,255,255,0.2)"/>
  <text x="48" y="22" font-family="Arial Black, sans-serif" font-size="10" font-weight="900" text-anchor="middle" fill="white">S</text>
  
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="35%" stop-color="#ef4444"/>
      <stop offset="70%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>
</svg>